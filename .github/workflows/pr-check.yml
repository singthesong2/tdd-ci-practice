name: PR check

on:
 pull_request:
  branches:[main]

permissions:
 contents: red

jobs:
 quality:
  runs-on:ubuntu-latest
  steps:
   -name:Checkout
   uses:actions/checkout@v6

   -name:Setup Node 24
    use:actions/setup-node@v6
    with:
     node-version:24
     cache:npm

     -name:Install
     run:npm ci

     -name:Test
     run:npm test